name: CI

on:
  push:
    branches: [main, "stabilize/**", "research/**"]
  pull_request:

permissions:
  contents: read

jobs:
  gcc-16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and test with GCC 16.2
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            gcc:16.2.0 \
            bash -lc '
              apt-get update >/dev/null &&
              apt-get install -y --no-install-recommends cmake ninja-build python3 time binutils >/dev/null &&
              cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMM_BUILD_BENCHMARKS=ON &&
              cmake --build build &&
              ctest --test-dir build --output-on-failure &&
              ./build/benchmarks/cmm_runtime_bench --iterations 10000 --batch 256 --json /tmp/cmm-benchmark.json &&
              python3 benchmarks/run_scale.py \
                --compiler "g++ -std=c++26 -freflection" \
                --counts 10 \
                --output /tmp/cmm-scale.json &&
              cmake --install build --prefix /tmp/cmm-install
            '

      - name: Sanitizers
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            gcc:16.2.0 \
            bash -lc '
              apt-get update >/dev/null &&
              apt-get install -y --no-install-recommends cmake ninja-build >/dev/null &&
              cmake -S . -B build-sanitize -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -fsanitize=address,undefined -fno-omit-frame-pointer" &&
              cmake --build build-sanitize &&
              ctest --test-dir build-sanitize --output-on-failure
            '
