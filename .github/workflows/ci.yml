name: CI

on:
  push:
    branches: [main, "stabilize/**", "research/**"]
  pull_request:

permissions:
  contents: read

jobs:
  gcc-16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Build and test with GCC 16.2
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            gcc:16.2.0 \
            bash -lc '
              apt-get update >/dev/null &&
              apt-get install -y --no-install-recommends cmake ninja-build python3 >/dev/null &&
              cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release &&
              cmake --build build &&
              ctest --test-dir build --output-on-failure &&
              python3 tools/reflection_fuzz/run.py \
                --family core \
                --cases 8 \
                --seed 1 \
                --compiler "gcc=g++ -std=c++26 -freflection" \
                --output-dir /tmp/cmm-reflection-fuzz-core &&
              python3 tools/reflection_fuzz/run.py \
                --family shapes \
                --cases 8 \
                --seed 1 \
                --compiler "gcc=g++ -std=c++26 -freflection" \
                --output-dir /tmp/cmm-reflection-fuzz-shapes &&
              python3 tools/reflection_fuzz/campaign.py \
                --programs 2 \
                --cases-per-program 1 \
                --family both \
                --compiler "gcc=g++ -std=c++26 -freflection" \
                --output-dir /tmp/cmm-reflection-fuzz-campaign &&
              cmake --install build --prefix /tmp/cmm-install
            '

      - name: Sanitizers
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            gcc:16.2.0 \
            bash -lc '
              apt-get update >/dev/null &&
              apt-get install -y --no-install-recommends cmake ninja-build >/dev/null &&
              cmake -S . -B build-sanitize -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -fsanitize=address,undefined -fno-omit-frame-pointer" &&
              cmake --build build-sanitize &&
              ctest --test-dir build-sanitize --output-on-failure
            '
