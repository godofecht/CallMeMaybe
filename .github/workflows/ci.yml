name: CI

on:
  push:
    branches: [main, "stabilize/**", "research/**"]
  pull_request:

permissions:
  contents: read

jobs:
  gcc-16:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Checkout pinned Flow compiler
        uses: actions/checkout@v7
        with:
          repository: flooooooooooow/flow
          ref: 4be80d962439f67936da041748bc9e4fed6c0708
          path: flow-lang

      - name: Build and test with GCC 16.2
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            gcc:16.2.0 \
            bash -lc '
              apt-get update >/dev/null &&
              apt-get install -y --no-install-recommends cmake ninja-build python3 python3-numpy time binutils librttr-dev git >/dev/null &&
              git clone --quiet https://github.com/wqking/metapp.git /tmp/metapp &&
              git -C /tmp/metapp checkout --quiet 2ef2ea1728fce0c9a6526b0820b03b7002d234d1 &&
              sed -i "/#include <array>/a #include <cstdint>" /tmp/metapp/include/metapp/variantdata.h &&
              cmake -S /tmp/metapp -B /tmp/metapp-build -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INSTALL_PREFIX=/tmp/metapp-install &&
              cmake --build /tmp/metapp-build &&
              cmake --install /tmp/metapp-build &&
              cmake -S . -B build -G Ninja \
                -DCMAKE_BUILD_TYPE=Release \
                -DCMAKE_PREFIX_PATH=/tmp/metapp-install \
                -DCMM_BUILD_BENCHMARKS=ON \
                -DCMM_BUILD_FLOW_BRIDGE=ON &&
              cmake --build build &&
              ctest --test-dir build --output-on-failure &&
              python3 tools/reflection_fuzz/run.py \
                --family core \
                --cases 8 \
                --seed 1 \
                --compiler "gcc=g++ -std=c++26 -freflection" \
                --output-dir /tmp/cmm-reflection-fuzz-core &&
              python3 tools/reflection_fuzz/run.py \
                --family shapes \
                --cases 8 \
                --seed 1 \
                --compiler "gcc=g++ -std=c++26 -freflection" \
                --output-dir /tmp/cmm-reflection-fuzz-shapes &&
              python3 tools/reflection_fuzz/campaign.py \
                --programs 2 \
                --cases-per-program 1 \
                --family both \
                --compiler "gcc=g++ -std=c++26 -freflection" \
                --output-dir /tmp/cmm-reflection-fuzz-campaign &&
              ./build/bridge/flow/cmm_flow_metrics &&
              ./build/bridge/flow/cmm_flow_generate_fixture > /tmp/generated_wrappers.flow &&
              cat bridge/flow/call_me_maybe.flow bridge/flow/ownership.flow bridge/flow/aggregate.flow /tmp/generated_wrappers.flow > /tmp/cmm_flow_module.flow &&
              PYTHONPATH=/src/flow-lang/src python3 -m flow.transpiler --c /tmp/cmm_flow_module.flow -o /tmp/cmm_flow_module.c &&
              cc -std=c11 -Werror -c /tmp/cmm_flow_module.c -o /tmp/cmm_flow_module.o &&
              g++ /tmp/cmm_flow_module.o \
                build/bridge/flow/libcmm_flow_e2e_runtime.a \
                build/bridge/flow/libcmm_flow_bridge.a \
                -pthread -o /tmp/cmm_flow_e2e &&
              /tmp/cmm_flow_e2e &&
              ./build/benchmarks/cmm_runtime_bench --iterations 10000 --batch 256 --json /tmp/cmm-benchmark.json &&
              ./build/benchmarks/cmm_rttr_bench --iterations 10000 --json /tmp/cmm-rttr.json &&
              ./build/benchmarks/cmm_metapp_bench --iterations 10000 --json /tmp/cmm-metapp.json &&
              python3 benchmarks/run_scale.py \
                --compiler "g++ -std=c++26 -freflection" \
                --counts 10 \
                --output /tmp/cmm-scale.json &&
              cmake --install build --prefix /tmp/cmm-install
            '

      - name: Sanitizers
        run: |
          docker run --rm \
            -v "$PWD:/src" \
            -w /src \
            gcc:16.2.0 \
            bash -lc '
              apt-get update >/dev/null &&
              apt-get install -y --no-install-recommends cmake ninja-build >/dev/null &&
              cmake -S . -B build-sanitize -G Ninja \
                -DCMAKE_BUILD_TYPE=Debug \
                -DCMM_BUILD_FLOW_BRIDGE=ON \
                -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -fsanitize=address,undefined -fno-omit-frame-pointer" &&
              cmake --build build-sanitize &&
              ctest --test-dir build-sanitize --output-on-failure
            '
